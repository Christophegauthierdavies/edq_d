name: Compiler le dictionnaire de données

on:
  push:
    branches: [main]
    paths:
      - "scripts/**/*.R"
      - "R/**"

jobs:
  build-dictionnaire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Installer les dépendances R
        run: install.packages(c("fs", "stringr", "dplyr", "purrr", "readr", "jsonlite", "openxlsx"))
        shell: Rscript {0}

      - name: Compiler le dictionnaire
        run: Rscript R/build_dictionary.R

      - name: Générer le classeur Excel
        run: Rscript R/export_excel.R

      - name: Publier les fichiers générés
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dictionnaire/
          git diff --cached --quiet || git commit -m "Régénère le dictionnaire de données"
          git push
